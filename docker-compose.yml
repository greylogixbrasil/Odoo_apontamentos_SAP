services:
  postgres:
    image: postgres:16-alpine
    container_name: sap_import_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sap_import
      POSTGRES_PASSWORD: sap_import
      POSTGRES_DB: sap_import
    ports:
      - "55432:5432"
    volumes:
      - sap_import_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      # historico do SharePoint pro dashboard de aging - roda depois do schema.sql (ordem alfabetica)
      - ./db/migrations/0004_aging_historico_sharepoint.sql:/docker-entrypoint-initdb.d/zz_0004_aging_historico_sharepoint.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap_import -d sap_import"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: sap_import_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve o POSTGRES_DSN do .env (que aponta pra localhost:55432, uso fora do
      # Docker) - dentro da rede do compose o Postgres e alcancado pelo nome do servico.
      # APP_POSTGRES_DSN permite trocar esse destino (ex: reaproveitar um Postgres externo
      # ja existente) sem editar este arquivo - default cobre o caso normal (stack completa).
      POSTGRES_DSN: ${APP_POSTGRES_DSN:-postgresql://sap_import:sap_import@postgres:5432/sap_import}
    ports:
      - "8010:8010"
    volumes:
      # Log do cron interno (envio diario as 02:00, ver docker/crontab) - sem isso some toda
      # vez que o container e recriado (deploy). O log estruturado de verdade (info/erro de
      # cada execucao) ja vai pro Postgres via app_log independente disso.
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sap_import_data:
